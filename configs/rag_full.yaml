# Full-corpus copy of rag.yaml (only `corpus` differs).
# Retrieval-side config for C1-C4 (acl_rag). One LightRAG index per corpus build.
#   python -m acl_rag.ingest  --rag-config configs/rag.yaml
#   python -m acl_rag.run     --rag-config configs/rag.yaml --config C2
#   python -m acl_rag.metrics --rag-config configs/rag.yaml

corpus: corpus/full_cf0.3_s42
working_dir: rag_storage/{corpus_name}   # LightRAG index (not in git)
results_dir: results/{corpus_name}       # one <config>.jsonl per run

backend:
  llm: ollama                 # openai | ollama   (team decision: ollama)
  llm_model: qwen3:32b-q8_0   # dense ~32B at 8-bit (fits one H100); same model for extraction, summaries and answers
  embedding: ollama           # openai | ollama
  embedding_model: bge-m3
  embedding_dim: 1024         # must match embedding_model; fixed once an index is built
  ollama_host: http://localhost:11434
  ollama_num_ctx: 32768       # LLM context window; Ollama's default silently truncates extraction prompts
  ollama_think: false         # Qwen3 thinks by default; reasoning text breaks LightRAG's extraction format
  ollama_temperature: 0       # greedy decoding; NOT bit-exact with OLLAMA_NUM_PARALLEL>1 batching, so
                              # rebuilds are reproducible only through the LLM cache (keep it with the index)
  ollama_seed: 42
  ollama_embed_num_ctx: 8192  # embedding context window (bge-m3 max)
  ollama_timeout: 600         # seconds per request; also LightRAG's LLM timeout (its worker limit is 2x this)
  ollama_num_predict: 6144    # max output tokens per call. Normal dev extractions are <= ~3k tokens
                              # (<= 10.7k chars); runaways ran past 16k tokens and hit the 600s timeout.
                              # A tight cap makes a runaway end as "truncated" in minutes; ingest
                              # --rounds then retries it (it rarely recurs).
  llm_max_async: 4            # keep <= OLLAMA_NUM_PARALLEL on the server

# Keep at lightrag-hku 1.5.7 defaults: the corpus's two merge regimes depend on them.
lightrag:
  chunk_token_size: 1200
  chunk_overlap_token_size: 100
  tiktoken_model_name: gpt-4o-mini
  force_llm_summary_on_merge: 8

query:
  mode: mix                   # LightRAG retrieval mode used for every config
  top_k: 40                   # entities / relations per vector search (1.5.7 default)
  chunk_top_k: 20             # chunks (1.5.7 default)
  enable_rerank: false        # no reranker configured
  response_type: Multiple Paragraphs

acl:
  max_candidates: 4096        # C3 oversampling ceiling per vector search

c4:
  capture_fragments: true     # preserve originals during ingestion, before merging
  fragments_file: c4_fragments.sqlite3
  description_strategy: auto # auto: pinned LightRAG summary policy; join: deterministic no-LLM composition

eval:
  recall_k: [1, 3, 5, 10]
