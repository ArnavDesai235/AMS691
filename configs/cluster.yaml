# Where the Ollama backend runs. Recorded from the cluster on 2026-10-19
# (scontrol / sinfo / sacctmgr / ollama show / nvidia-smi). Reference only:
# nothing reads this file at runtime; the job script and rag.yaml carry the
# values that matter. Update both if anything here changes.

cluster:
  name: ai-cluster-slurm            # scontrol ClusterName
  login_node: ai-slurm01
  slurm_version: 23.11.4
  account: default
  qos: normal                       # no per-user job or GRES limits set
  home_fs: /home (NFS, 105T)        # no $SCRATCH on this cluster

partition:
  name: defq                        # the only partition (default)
  time_limit: 7-00:00:00

# GRES is untyped (gres/gpu=N): --gres=gpu:1 can land on ANY node, including
# the V100s. Always pin with --nodelist=h100.
nodes:
  h100:   {gpus: 4, gpu_model: "NVIDIA H100 80GB", cpus: 64, mem_mb: 385000, use_for: ollama}
  orion:  {gpus: 4, gpu_model: unrecorded, cpus: 72, mem_mb: 1545000}
  quadro1: {gpus: 8, gpu_model: unrecorded, cpus: 64, mem_mb: 385000}
  quadro2: {gpus: 8, gpu_model: unrecorded, cpus: 64, mem_mb: 385000}
  tesla1: {gpus: 8, gpu_model: "Tesla V100-SXM2-32GB", cpus: 64, mem_mb: 385000}
  tesla2: {gpus: 8, gpu_model: "Tesla V100-SXM2-32GB", cpus: 64, mem_mb: 385000}
gpu_driver: 550.163.01              # CUDA 12.4 (seen on a V100 node)

job:
  nodelist: h100
  gres: gpu:1
  cpus_per_task: 8
  mem: 64G
  time: "08:00:00"
  min_gpu_mem_mib: 70000            # job script aborts below this (qwen3 32B q8 + 4x32k KV ~ 67 GB)

conda_env:
  name: AMS691
  prefix: /home/armdesai/.conda/envs/AMS691
  python: "3.15.0"                  # as installed; tests verified on 3.12 (see DESIGN_backend.md)
  packages:
    lightrag-hku: 1.5.7
    ollama: 0.6.3                   # Python client
    tiktoken: 0.14.0
    pyyaml: 6.0.3
    numpy: 2.5.4
    anthropic: 1.15.0
    wordfreq: 3.1.1
    english-words: 2.0.2
    pytest: 9.1.1
  env_vars:
    OLLAMA_MODELS: /home/armdesai/ollama_models
    TIKTOKEN_CACHE_DIR: /home/armdesai/.conda/envs/AMS691/share/tiktoken

ollama:
  server_version: 0.40.6            # binary in $CONDA_PREFIX/bin, libs in lib/ollama (cuda_v12, cuda_v13, vulkan)
  models_dir_size: 34G
  models:
    llm:
      tag: qwen3:32b-q8_0
      id: a46beca077e5
      size: 35 GB
      architecture: qwen3
      parameters: 32.8B
      quantization: Q8_0
      context_length: 40960         # rag.yaml uses num_ctx 32768
      defaults_overridden: {thinking: true, temperature: 0.6}   # rag.yaml sends think=false, temperature=0, seed=42
    embedding:
      tag: bge-m3:latest
      id: "790764642607"
      size: 1.2 GB
      architecture: bert
      parameters: 566.70M
      quantization: F16
      context_length: 8192
      embedding_dim: 1024
